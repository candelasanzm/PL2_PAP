<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>PL2 PAP</title>
        <link rel="stylesheet" href="/style.css">
    </head>

    <body>
        <!-- Cabecera de la pagina -->
        <h1>PL2 PAP - Visor de Partidas</h1>
        
        <!-- Estadisticas globales calculadas a partir de las partidas-->
        <div class="estadisticas">
            <div class="stat-card">
                <div class="stat-numero" id="totalPartidas">0</div>
                <div class="stat-label">Partidas Totales</div>
            </div>
            <div class="stat-card">
                <div class="stat-numero" id="totalUsuarios">0</div>
                <div class="stat-label">Usuarios Activos</div>
            </div>
            <div class="stat-card">
                <div class="stat-numero" id="faseMasUsada">-</div>
                <div class="stat-label">Fase Más Usada</div>
            </div>
        </div>

        <!-- Filtros de busqueda -->
         <div class="filtros">
            <input type="text" id="filtroUsuario" placeholder="Filtrar por usuario...">
            <select id="filtroFase">
                <option value="">Todas las fases</option>
                <option value="Fase 1">Fase 1 - Despegues</option>
                <option value="Fase 2">Fase 2 - Aterrizajes</option>
                <option value="Fase 3">Fase 3 - Estadisticas</option>
                <option value="Fase 4">Fase 4 - Aeropuertos</option>
            </select>
            <select id="filtroSubfase">
                <option value="">Todas las opciones</option>
            </select>
            <button id="btnLimpiar">Limpiar Filtros</button>
        </div>
        
        <div class="barra-tabla">
            <button id="btnDarkMode">Modo Oscuro</button>
            <div class="contador" id="contador">
                Mostrando <strong>0</strong> de <strong>0</strong> partidas registradas.
            </div>
        </div>

        <!-- Tabla principal donde se mostraran las partidas -->
        <table id="tabla">
            <thead>
                <!-- Cabecera de la tabla con el nombre de cada columna -->
                <tr>
                    <th data-columna="usuario">Usuario<span class="flecha">⇅</span></th>
                    <th data-columna="fase">Fase<span class="flecha">⇅</span></th>
                    <th data-columna="opciones_entrada">Opciones de Entrada<span class="flecha">⇅</span></th>
                    <th>Resultados</th>
                    <th data-columna="fecha_hora">Fecha y Hora<span class="flecha">⇅</span></th>
                </tr>
            </thead>
            <!-- Cuerpo de la tabla, se rellena dinamicamente con JavaScript -->
            <tbody></tbody>
        </table>

        <!-- Script que carga las partidas desde la API y las dibuja en la tabla -->
        <script>
            let partidas = []; // guardamos todas las partidas para poder filtrar sin volver a la base de datos

            let columnaOrdenada = "fecha_hora"; // por defecto ordenamos por fecha y hora
            let orden = "desc"; // por defecto orden descendente (de mas reciente a mas antigua)

            // Objeto que contiene las subopciones disponibles para cada fase
            const subopcionesPorFase = {
                'Fase 1': [
                    'Fase 1 - Retrasos en Despegues',
                    'Fase 1 - Adelantos en Despegues',
                    'Fase 1 - Despegues a tiempo'
                ],
                'Fase 2': [
                    'Fase 2 - Retrasos en Aterrizajes',
                    'Fase 2 - Adelantos en Aterrizajes',
                    'Fase 2 - Aterrizajes a tiempo'
                ],
                'Fase 3': [
                    'Fase 3 - DEP_DELAY (Maximo)',
                    'Fase 3 - DEP_DELAY (Minimo)',
                    'Fase 3 - ARR_DELAY (Maximo)',
                    'Fase 3 - ARR_DELAY (Minimo)',
                    'Fase 3 - WEATHER_DELAY (Maximo)',
                    'Fase 3 - WEATHER_DELAY (Minimo)',
                    'Fase 3 - DEP_TIME (Maximo)',
                    'Fase 3 - DEP_TIME (Minimo)',
                    'Fase 3 - ARR_TIME (Maximo)',
                    'Fase 3 - ARR_TIME (Minimo)'
                ],
                'Fase 4': [
                    'Fase 4 - Histograma Aeropuertos origen',
                    'Fase 4 - Histograma Aeropuertos destino',
                    'Fase 4 - Busqueda Aeropuerto origen',
                    'Fase 4 - Busqueda Aeropuerto destino',
                    'Fase 4 - Top 5 Mas Concurridos (origen)',
                    'Fase 4 - Top 5 Mas Concurridos (destino)',
                    'Fase 4 - Top 5 Menos Concurridos (origen)',
                    'Fase 4 - Top 5 Menos Concurridos (destino)'
                ]
            };

            // Hacemos una petición GET a la API para obtener las partidas registradas
            fetch('/api/partidas')
                .then(res => res.json()) // convertimos la respuesta a JSON
                .then(data => {
                    partidas = data; // guardamos las partidas para luego filtrar
                    calcularEstadisticas(data); // calculamos las estadisticas globales 
                    aplicarFiltros(); // aplicamos los filtros al inicio y dibujamos la tabla
                })
                .catch(error => {
                    console.error('Error al cargar las partidas:', error);
                });

            // Funcion que rellena el desplegable de las fases
            function rellenarSubFases() {
                const faseSeleccionada = document.getElementById('filtroFase').value;
                const subfaseSelect = document.getElementById('filtroSubfase');

                // Limpiamos el desplegable y dejamos solo la opcion "Todas"
                subfaseSelect.innerHTML = '<option value="">Todas las opciones</option>';

                // Si no hay fase seleccionada o no tenemos subopciones para ella no hacemos mas
                if (!faseSeleccionada || !subopcionesPorFase[faseSeleccionada]) {
                    return;
                }

                // Por cada subopcion de la fase elegida, creamos una opcion en el desplegable
                subopcionesPorFase[faseSeleccionada].forEach(subfase => {
                    const option = document.createElement('option');
                    option.value = subfase;
                    option.textContent = subfase;
                    subfaseSelect.appendChild(option);
                });
            }

            // Funcion que dibuja la tabla con las partidas
            function dibujarTabla(partidasMostrar) {
                const tbody = document.querySelector('#tabla tbody'); // seleccionamos el cuerpo de la tabla donde insertamos las filas
                tbody.innerHTML = ''; // limpiamos el contenido del tbody para evitar duplicados
                    
                // Actualizamos el contador con las partidas a mostrar y el total
                document.getElementById('contador').innerHTML = `Mostrando <strong>${partidasMostrar.length}</strong> de <strong>${partidas.length}</strong> partidas registradas.`;

                // Ponemos las flechitas de ordenacion 
                document.querySelectorAll('th .flecha').forEach(f => {
                    f.textContent = '⇅'; // por defecto todas las columnas tienen la flecha de ordenacion hacia abajo
                    f.classList.remove('activa'); // eliminamos las clases de ordenacion para quitar el color a la flecha
                });
                const cabeceraOrden = document.querySelector(`th[data-columna="${columnaOrdenada}"] .flecha`);
                if (cabeceraOrden) {
                    cabeceraOrden.textContent = orden === 'asc' ? '↑' : '↓';
                    cabeceraOrden.classList.add('activa'); // añadimos una clase para resaltar la columna por la que se esta ordenando
                }

                // Construimos el HTML completo como un string acumulado para no tocar el DOM
                let htmlCompleto = '';

                // Recorremos cada partida del array que nos devuelve el servidor
                partidasMostrar.forEach(partida => {

                    // Variable donde construiremos el HTML de la lista de resultados
                    let listaResultados = '';

                    // Si la partida tiene resultados, los mostramos en una lista
                    if (partida.resultados && partida.resultados.length > 0) {
                        // Buscamos el valor maximo de vuelos para escalar las barras del histograma
                        let maxVuelos = 0;
                        partida.resultados.forEach(r => {
                            const match = r.detalle.match(/(\d+)\s+vuelos/); // buscamos un numero seguido de "vuelos" en el detalle del resultado
                            if (match) {
                                const valor = parseInt(match[1]); // si encontramos el patron, convertimos el numero a entero
                                if (valor > maxVuelos) {
                                    maxVuelos = valor; // actualizamos el maximo de vuelos si el valor encontrado es mayor
                                }
                            }
                        });

                        listaResultados = '<ul>'; // abrimos lista no ordenada
                        // Por cada resultado creamos un <li> con su detalle
                        partida.resultados.forEach(r => {
                            // Comprobamos si el restultado es un histograma buscando el patron "X vuelos" en su detalle
                            const match = r.detalle.match(/(\d+)\s+vuelos/); // buscamos un numero seguido de "vuelos" en el detalle del resultado
                            if (match && maxVuelos > 0) {
                                const valor = parseInt(match[1]); // si encontramos el patron, convertimos el numero a entero
                                const porcentaje = (valor / maxVuelos) * 100; // calculamos el porcentaje del valor respecto al maximo para escalar la barra del histograma
                                // Dibujamos el texto y una barra horizontal con el ancho proporcional
                                listaResultados += `
                                    <li>
                                        ${r.detalle}
                                        <div class="barra_histograma">
                                            <div class="barra" style="width: ${porcentaje}%;"></div>
                                        </div>
                                    </li>
                                `;
                            } else {
                                // Si no es un histograma, simplemente mostramos el detalle del resultado
                                listaResultados += `<li>${r.detalle}</li>`;
                            }
                        });
                        listaResultados += '</ul>'; // cerramos la lista
                    } else {
                        // Si no hay resultados mostramos un mensaje
                        listaResultados = '<em>Sin resultados</em>';
                    }

                    // Añadimos una nueva fila a la tabla con todos los datos de la partida
                    htmlCompleto += `
                        <tr>
                            <td>${partida.usuario}</td>
                            <td>${partida.fase}</td>
                            <td>${partida.opciones_entrada || ''}</td> 
                            <td>${listaResultados}</td>
                            <td>${new Date(partida.fecha_hora).toLocaleString('es-ES')}</td> 
                        </tr>
                    `;
                });

                // Asignamos al DOM una sola vez al final para evitar repintados innecesarios y mejorar el rendimiento
                tbody.innerHTML = htmlCompleto;
            }

            // Funcion que calcula las estadisticas globales
            function calcularEstadisticas(partidas) {
                // Total de partidas
                document.getElementById('totalPartidas').textContent = partidas.length;

                // Usuarios activos: usamos un set para eliminar duplicados
                const usuariosUnicos = new Set(partidas.map(p => p.usuario));
                document.getElementById('totalUsuarios').textContent = usuariosUnicos.size;

                // Fase más usada: contamos cuantas veces aparece cada fase
                const contadorFases = {}; // objeto donde guardamos cuantas veces aparece cada fase
                partidas.forEach(p => {
                    contadorFases[p.fase] = (contadorFases[p.fase] || 0) + 1; // si no existe la creamos a 1, si existe sumamos 1
                });

                // Buscamos la fase con mas apariciones
                let faseMasUsada = '-';
                let maxConteo = 0;
                for (const fase in contadorFases) {
                    if (contadorFases[fase] > maxConteo) {
                        maxConteo = contadorFases[fase];
                        faseMasUsada = fase;
                    }
                }

                // Si la fase es muy larga la acortamos para que quepa visualmente
                if (faseMasUsada.length > 30) {
                    faseMasUsada = faseMasUsada.substring(0, 30) + '...';
                }

                document.getElementById('faseMasUsada').textContent = faseMasUsada;
            }

            // Funcion que aplica los filtros y vuelve a dibujar la tabla
            function aplicarFiltros() {
                const textoUsuario = document.getElementById('filtroUsuario').value.toLowerCase(); // texto del filtro de usuario en minusculas
                const faseSeleccionada = document.getElementById('filtroFase').value; // fase seleccionada en el desplegable
                const subfaseSeleccionada = document.getElementById('filtroSubfase').value; // subfase seleccionada en el desplegable

                const partidasFiltradas = partidas.filter(partida => {
                    const coincideUsuario = !textoUsuario || partida.usuario.toLowerCase().includes(textoUsuario); // si el filtro de usuario esta vacio o el usuario de la partida incluye el texto del filtro
                    
                    // Si hay subfase elegida debe coincidir exactamente. Si solo hay fase elegida basta con que la partida empiece por ese texto
                    let coincideFase = true; // por defecto la partida coincide con el filtro de fase
                    if (subfaseSeleccionada) {
                        coincideFase = partida.fase === subfaseSeleccionada; // si hay subfase seleccionada, la fase de la partida debe coincidir exactamente con ella
                    } else if (faseSeleccionada) {
                        coincideFase = partida.fase.startsWith(faseSeleccionada); // si solo hay fase seleccionada, la fase de la partida debe empezar por el texto de la fase seleccionada
                    }

                    return coincideUsuario && coincideFase; // la partida se muestra si coincide el filtro de usuario y el filtro de fase
                });

                const partidasOrdenadas = ordenarPartidas(partidasFiltradas); // ordenamos antes de imprimir la tabla en pantalla
                dibujarTabla(partidasOrdenadas); // dibujamos la tabla con las partidas ordenadas segun el filtro elegido
            }

            // Funcion que ordena un array de partidas segun la columna y direccion
            function ordenarPartidas(partidasOrdenadas) {
                return partidasOrdenadas.sort((a, b) => {
                    let valorA = a[columnaOrdenada];
                    let valorB = b[columnaOrdenada];

                    // Si la columna a ordenar es fecha_hora, convertimos los valores a objetos Date para compararlos correctamente
                    if (columnaOrdenada === 'fecha_hora') {
                        valorA = new Date(valorA);
                        valorB = new Date(valorB);
                    } else {
                        // Para texto pasamos a minusculas para que la ordenacion no sea sensible a mayusculas
                        valorA = (valorA || '').toString().toLowerCase();
                        valorB = (valorB || '').toString().toLowerCase();
                    }

                    // Comparamos segun la direccion de ordenacion que el usuario elija
                    if (valorA < valorB) {
                        return orden === 'asc' ? -1 : 1; // si el orden es ascendente, A va antes que B. Si es descendente, B va antes que A
                    } else if (valorA > valorB) {
                        return orden === 'asc' ? 1 : -1; // si el orden es ascendente, B va antes que A. Si es descendente, A va antes que B
                    } else {
                        return 0; // si son iguales no cambiamos su orden
                    }
                })
            }

            // Eventos: cuando el usuario interactua con los filtros
            document.getElementById('filtroUsuario').addEventListener('input', aplicarFiltros); // cada vez que el usuario escribe en el filtro de usuario, aplicamos los filtros
            document.getElementById('filtroFase').addEventListener('change', () => {
                rellenarSubFases(); // cada vez que el usuario cambia la fase seleccionada, actualizamos las subfases disponibles
                aplicarFiltros(); // cada vez que el usuario cambia la fase seleccionada, aplicamos los filtros
            }); // cada vez que el usuario cambia la fase seleccionada, aplicamos los filtros
            document.getElementById('filtroSubfase').addEventListener('change', aplicarFiltros); // cada vez que el usuario cambia la subfase seleccionada, aplicamos los filtros

            // Botón para limpiar los filtros y mostrar todas las partidas otra vez
            document.getElementById('btnLimpiar').addEventListener('click', () => {
                document.getElementById('filtroUsuario').value = ''; // limpiamos el filtro de usuario
                document.getElementById('filtroFase').value = ''; // limpiamos el filtro de fase
                document.getElementById('filtroSubfase').value = ''; // limpiamos el filtro de subfase
                aplicarFiltros(); // volvemos a dibujar la tabla con todas las partidas
            });

            // Cuando se hace click en una cabecera cambiamos la ordenacion
            document.querySelectorAll('th[data-columna]').forEach(th => {
                th.addEventListener('click', () => {
                    const columna = th.getAttribute('data-columna'); // columna por la que se ha hecho click

                    if (columnaOrdenada === columna) {
                        // Si ya estamos ordenando por esa columna, cambiamos la direccion
                        orden = orden === 'asc' ? 'desc' : 'asc';
                    } else {
                        // Si no, empezamos a ordenar por esa columna en orden ascendente
                        columnaOrdenada = columna;
                        orden = 'asc';
                    }

                    aplicarFiltros(); // volvemos a filtrar y ordenar
                })
            })

            // Boton para cambiar entre modo claro y modo oscuro
            const btnDarkMode = document.getElementById('btnDarkMode');
            btnDarkMode.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode'); // añade o quita la clase dark-mode

                // Cambiamos el texto del boton segun el modo
                if(document.body.classList.contains('dark-mode')) {
                    btnDarkMode.textContent = 'Modo Claro';
                } else {
                    btnDarkMode.textContent = 'Modo Oscuro';
                }
            })

            // Auto-refresh: cada 30 segundos volvemos a pedir las partidas al servidr
            setInterval(() => {
                fetch('/api/partidas')
                .then(res => res.json()) // convertimos la respuesta a JSON
                .then(data => {
                    partidas = data; // guardamos las partidas para luego filtrar
                    calcularEstadisticas(data); // calculamos las estadisticas globales 
                    aplicarFiltros(); // aplicamos los filtros al inicio y dibujamos la tabla
                })
                .catch(error => {
                    console.error('Error al cargar las partidas:', error);
                });
            }, 30000); // 30000 milisegundos = 30 segundos
        </script>
    </body>
</html>
