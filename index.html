<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>PL2 PAP</title>
    </head>

    <body>
        <h1>Paradigmas de Programación Avanzada</h1>
        <p>Listado de partidas ejecutadas en el programa CUDA, ordenadas por fecha.</p>

        <table border="1" id="tabla">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Fase</th>
                    <th>Opciones de Entrada</th>
                    <th>Resultados</th>
                    <th>Fecha y Hora</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <script>
            fetch('/api/partidas')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector('#tabla tbody');
                    data.forEach(partida => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${partida.usuario}</td>
                                <td>${partida.fase}</td>
                                <td>${partida.opcionesEntrada || ''}</td>
                                <td>${partida.resultados || ''}</td>
                                <td>${new Date(partida.fechaHora).toLocaleString('es-ES')}</td>
                            </tr>
                        `;
                    });
                })
                .catch(error => {
                    console.error('Error al cargar las partidas:', error);
                });
        </script>
    </body>
</html>
