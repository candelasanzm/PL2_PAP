<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>PL2 PAP</title>
        <link rel="stylesheet" href="/style.css">
    </head>

    <body>
        <h1>Paradigmas de Programación Avanzada</h1>
        <p>Listado de partidas ejecutadas en el programa CUDA, ordenadas por fecha.</p>

        <table id="tabla">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Fase</th>
                    <th>Opciones de Entrada</th>
                    <th>Resultados</th>
                    <th>Fecha y Hora</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <script>
            fetch('/api/partidas')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector('#tabla tbody');
                    data.forEach(partida => {
                        let listaResultados = '';
                        if (partida.resultados && partida.resultados.length > 0) {
                            listaResultados = '<ul>';
                            partida.resultados.forEach(r => {
                                listaResultados += `<li>${r.detalle}</li>`;
                            });
                            listaResultados += '</ul>';
                        } else {
                            listaResultados = '<em>Sin resultados</em>';
                        }


                        tbody.innerHTML += `
                            <tr>
                                <td>${partida.usuario}</td>
                                <td>${partida.fase}</td>
                                <td>${partida.opciones_entrada || ''}</td>
                                <td>${listaResultados}</td>
                                <td>${new Date(partida.fecha_hora).toLocaleString('es-ES')}</td>
                            </tr>
                        `;
                    });
                })
                .catch(error => {
                    console.error('Error al cargar las partidas:', error);
                });
        </script>
    </body>
</html>
